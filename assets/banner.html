<!doctype html>
<!--
  Fonte do banner do perfil (assets/banner.png). Usa as fontes Bahnschrift, Segoe UI e Consolas do Windows.
  Para gerar a imagem de novo, rode na pasta assets (PowerShell):
  & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu --hide-scrollbars --default-background-color=00000000 --force-device-scale-factor=2 --window-size=1200,260 --screenshot="$PWD\banner.png" "$PWD\banner.html"
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .banner {
    position: relative;
    width: 1200px; height: 260px;
    border-radius: 14px;
    overflow: hidden;
    background: #f7f5f0;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,.08);
  }
  .text {
    position: absolute; left: 76px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font-family: 'Segoe UI', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    color: #0e7490;
  }
  .name {
    margin-top: 10px;
    font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
    font-size: 72px; font-weight: 700; line-height: 1;
    color: #111827; letter-spacing: -.5px;
    font-variation-settings: 'wdth' 92, 'wght' 700;
  }
  .tagline {
    margin-top: 16px;
    font-family: 'Segoe UI', sans-serif;
    font-size: 23px; color: #4b5563;
  }
  .mark {
    position: absolute; right: 80px; top: 50%; transform: translateY(-50%);
    font-family: 'Consolas', monospace; font-size: 120px; font-weight: 700;
    color: #0e7490; opacity: .10; letter-spacing: -6px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="text">
    <div class="kicker">DESENVOLVEDOR FULL STACK</div>
    <div class="name">Eliel Marcos</div>
    <div class="tagline">Web, mobile e APIs, do banco de dados até a tela.</div>
  </div>
  <div class="mark">&lt;/&gt;</div>
</div>
</body>
</html>
