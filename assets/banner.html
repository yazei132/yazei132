<!doctype html>
<!--
  Fonte do banner do perfil (assets/banner.png). Usa as fontes Bahnschrift e Consolas do Windows.
  Para gerar a imagem de novo, rode na pasta assets (PowerShell):
  & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu --hide-scrollbars --default-background-color=00000000 --force-device-scale-factor=2 --window-size=1200,300 --screenshot="$PWD\banner.png" "$PWD\banner.html"
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .banner {
    position: relative;
    width: 1200px; height: 300px;
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(148,163,184,.14) 1px, transparent 0) 0 0 / 22px 22px,
      radial-gradient(ellipse 60% 90% at 78% 50%, rgba(34,211,238,.10), transparent 70%),
      radial-gradient(ellipse 40% 70% at 8% 100%, rgba(245,158,11,.10), transparent 70%),
      linear-gradient(120deg, #080e1a 0%, #0c1626 55%, #0a1220 100%);
    font-family: 'Bahnschrift', 'Segoe UI', sans-serif;
  }
  .art { position: absolute; inset: 0; }
  .text {
    position: absolute; left: 64px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font-family: 'Consolas', monospace;
    font-size: 16px; color: #67e8f9; opacity: .9;
    letter-spacing: .3px; margin-bottom: 10px;
  }
  .kicker b { color: #fbbf24; font-weight: 400; }
  .name {
    font-size: 76px; font-weight: 700; line-height: 1;
    color: #f8fafc; letter-spacing: .5px;
    font-variation-settings: 'wdth' 90, 'wght' 700;
  }
  .role {
    margin-top: 12px;
    font-size: 20px; letter-spacing: 5px; color: #fbbf24;
    font-variation-settings: 'wdth' 100, 'wght' 600;
  }
  .chips { display: flex; gap: 8px; margin-top: 22px; }
  .chip {
    font-family: 'Consolas', monospace; font-size: 14px; color: #cbd5e1;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid rgba(148,163,184,.28);
    background: rgba(15,23,42,.55);
  }
  .edge {
    position: absolute; inset: 0; border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(148,163,184,.18);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="banner">
  <svg class="art" viewBox="0 0 1200 300" width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="route" x1="630" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#22d3ee"/>
        <stop offset="1" stop-color="#f59e0b"/>
      </linearGradient>
      <linearGradient id="fade" x1="560" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="fadeMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
    </defs>

    <g mask="url(#fadeMask)">
      <!-- prateleiras -->
      <g id="racks" fill="rgba(30,41,59,.55)" stroke="rgba(148,163,184,.30)" stroke-width="1">
        <rect x="660" y="52" width="34" height="196" rx="3"/>
        <rect x="746" y="52" width="34" height="196" rx="3"/>
        <rect x="832" y="52" width="34" height="196" rx="3"/>
        <rect x="918" y="52" width="34" height="196" rx="3"/>
        <rect x="1004" y="52" width="34" height="196" rx="3"/>
        <rect x="1090" y="52" width="34" height="196" rx="3"/>
      </g>
      <!-- divisões das posições -->
      <g stroke="rgba(148,163,184,.18)" stroke-width="1">
        <path d="M660 80h34M660 108h34M660 136h34M660 164h34M660 192h34M660 220h34"/>
        <path d="M746 80h34M746 108h34M746 136h34M746 164h34M746 192h34M746 220h34"/>
        <path d="M832 80h34M832 108h34M832 136h34M832 164h34M832 192h34M832 220h34"/>
        <path d="M918 80h34M918 108h34M918 136h34M918 164h34M918 192h34M918 220h34"/>
        <path d="M1004 80h34M1004 108h34M1004 136h34M1004 164h34M1004 192h34M1004 220h34"/>
        <path d="M1090 80h34M1090 108h34M1090 136h34M1090 164h34M1090 192h34M1090 220h34"/>
      </g>
      <!-- posições coletadas -->
      <g fill="rgba(251,191,36,.20)" stroke="#fbbf24" stroke-opacity=".85">
        <rect x="746.5" y="164.5" width="33" height="27" rx="2"/>
        <rect x="832.5" y="80.5" width="33" height="27" rx="2"/>
        <rect x="918.5" y="192.5" width="33" height="27" rx="2"/>
        <rect x="1004.5" y="108.5" width="33" height="27" rx="2"/>
        <rect x="1090.5" y="136.5" width="33" height="27" rx="2"/>
      </g>

      <!-- rota -->
      <path d="M600 272 H720 V30 H806 V272 H892 V30 H978 V272 H1064 V30 H1150 V150"
            fill="none" stroke="url(#route)" stroke-width="7" stroke-opacity=".35"
            stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M600 272 H720 V30 H806 V272 H892 V30 H978 V272 H1064 V30 H1150 V150"
            fill="none" stroke="url(#route)" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>

      <!-- paradas -->
      <g stroke-width="2">
        <circle cx="720" cy="178" r="6" fill="#0b1324" stroke="#38bdf8"/>
        <circle cx="806" cy="94"  r="6" fill="#0b1324" stroke="#7dd3d8"/>
        <circle cx="892" cy="206" r="6" fill="#0b1324" stroke="#b9c88a"/>
        <circle cx="978" cy="122" r="6" fill="#0b1324" stroke="#dcb85a"/>
        <circle cx="1064" cy="150" r="6" fill="#0b1324" stroke="#f2a83a"/>
      </g>

      <!-- códigos de endereço -->
      <g fill="#0b1324" stroke="rgba(148,163,184,.30)" stroke-width="1">
        <rect x="727.5" y="187.5" width="53" height="17" rx="4"/>
        <rect x="813.5" y="103.5" width="53" height="17" rx="4"/>
        <rect x="899.5" y="215.5" width="53" height="17" rx="4"/>
        <rect x="985.5" y="131.5" width="53" height="17" rx="4"/>
        <rect x="1071.5" y="159.5" width="53" height="17" rx="4"/>
      </g>
      <g font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">
        <text x="733" y="200">A-02-05</text>
        <text x="819" y="116">B-03-02</text>
        <text x="905" y="228">C-04-06</text>
        <text x="991" y="144">D-05-03</text>
        <text x="1077" y="172">E-06-04</text>
      </g>

      <!-- fim da rota -->
      <circle cx="1150" cy="150" r="16" fill="#f59e0b" opacity=".18" filter="url(#glow)"/>
      <circle cx="1150" cy="150" r="12" fill="#0b1324" stroke="#f59e0b" stroke-width="2"/>
      <path d="M1144.5 150.5 l4 4 l7.5 -8" fill="none" stroke="#fbbf24" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>

  <div class="text">
    <div class="kicker">&gt; separação de pedidos <b>·</b> integração com ERP <b>·</b> offline-first</div>
    <div class="name">Eliel Marcos</div>
    <div class="role">DESENVOLVEDOR FULL STACK</div>
    <div class="chips">
      <span class="chip">TypeScript</span>
      <span class="chip">Node.js</span>
      <span class="chip">React</span>
      <span class="chip">React Native</span>
      <span class="chip">PostgreSQL</span>
    </div>
  </div>
  <div class="edge"></div>
</div>
</body>
</html>
